// ─── WARBAND WARRIOR SIMULATION ────────────────────────────────────────
// Stat profiles per faction
const WARRIOR_PROFILES = {
  villager: { hpMin: 8, hpMax: 11, atkMin: 2, atkMax: 3, diffMin: 6, diffMax: 8, fumMin: 3, fumMax: 5 },
  ashkin:   { hpMin: 5, hpMax: 8,  atkMin: 1, atkMax: 2, diffMin: 4, diffMax: 5, fumMin: 6, fumMax: 8 },
};

function spawnWarriors(count, side, orders, heartBonus) {
  const profile = side === 'ally' ? WARRIOR_PROFILES.villager : WARRIOR_PROFILES.ashkin;
  const warriors = [];
  for (let i = 0; i < count; i++) {
    const hp = profile.hpMin + Math.floor(Math.random() * (profile.hpMax - profile.hpMin + 1));
    const attack = profile.atkMin + Math.floor(Math.random() * (profile.atkMax - profile.atkMin + 1));
    const difficulty = profile.diffMin + Math.floor(Math.random() * (profile.diffMax - profile.diffMin + 1));
    const fumbleMax = profile.fumMin + Math.floor(Math.random() * (profile.fumMax - profile.fumMin + 1));

    // Orders modify stats
    let atkMod = 0, defMod = 0;
    if (orders === 'charge')    { atkMod = 2; defMod = -1; }
    if (orders === 'shieldwall'){ atkMod = -1; defMod = 2; }

    // Heart bonus for allies — small morale boost
    const heartMod = side === 'ally' ? Math.floor(heartBonus / 2) : 0;

    warriors.push({
      hp, maxHp: hp,
      attack: Math.max(1, attack + atkMod + heartMod),
      difficulty: Math.max(3, difficulty - defMod),
      fumbleMax,
      stunned: false,
      bleed: 0,
    });
  }
  return warriors;
}

function resolveWarbandCombat() {
  const allies = combat.allyWarriors.filter(w => w.hp > 0);
  const enemies = combat.enemyWarriors.filter(w => w.hp > 0);

  if (allies.length === 0 || enemies.length === 0) return '';

  // Pair up warriors — shuffle for random matchups
  const shuffled = [...enemies].sort(() => Math.random() - 0.5);

  // Each ally fights one enemy (or multiple if outnumbering)
  for (let i = 0; i < allies.length; i++) {
    const ally = allies[i];
    const enemy = shuffled[i % shuffled.length]; // wrap around if outnumbering
    if (ally.hp <= 0 || enemy.hp <= 0) continue;

    // Apply bleed
    if (ally.bleed > 0) { ally.hp -= ally.bleed; }
    if (enemy.bleed > 0) { enemy.hp -= enemy.bleed; }
    if (ally.hp <= 0 || enemy.hp <= 0) continue;

    // Skip if stunned
    if (!ally.stunned) {
      // Ally attacks enemy
      const roll = rng(1, 100);
      const effective = roll + ally.attack * 5 - enemy.difficulty * 2;
      const tier = getTier(effective, ally.fumbleMax);
      const dmg = warbandDamage(tier);
      enemy.hp -= dmg.damage;
      if (dmg.stun) enemy.stunned = true;
      if (dmg.bleed) enemy.bleed += 1;
    } else {
      ally.stunned = false;
    }

    if (enemy.hp <= 0) continue;

    // Enemy counter-attacks (if not stunned)
    if (!enemy.stunned) {
      const roll2 = rng(1, 100);
      const effective2 = roll2 + enemy.attack * 5 - ally.difficulty * 2;
      const tier2 = getTier(effective2, enemy.fumbleMax);
      const dmg2 = warbandDamage(tier2);
      ally.hp -= dmg2.damage;
      if (dmg2.stun) ally.stunned = true;
      if (dmg2.bleed) ally.bleed += 1;
    } else {
      enemy.stunned = false;
    }
  }

  // Extra attacks for outnumbering side (unpaired warriors get free hits)
  if (enemies.length > allies.length) {
    for (let i = allies.length; i < enemies.length; i++) {
      const enemy = shuffled[i];
      if (enemy.hp <= 0 || enemy.stunned) continue;
      // Attack random alive ally
      const targets = allies.filter(a => a.hp > 0);
      if (targets.length === 0) break;
      const target = targets[Math.floor(Math.random() * targets.length)];
      const roll = rng(1, 100);
      const effective = roll + enemy.attack * 5 - target.difficulty * 2;
      const tier = getTier(effective, enemy.fumbleMax);
      const dmg = warbandDamage(tier);
      target.hp -= dmg.damage;
      if (dmg.stun) target.stunned = true;
      if (dmg.bleed) target.bleed += 1;
    }
  }

  // Archer bonus — each archer takes a shot at a random enemy
  if (combat.archerBonus && combat.archerCount > 0) {
    for (let i = 0; i < combat.archerCount; i++) {
      const targets = combat.enemyWarriors.filter(e => e.hp > 0);
      if (targets.length === 0) break;
      const target = targets[Math.floor(Math.random() * targets.length)];
      const roll = rng(1, 100);
      const effective = roll + 2 * 5 - target.difficulty * 2; // archers have ~2 attack
      const tier = getTier(effective, 5);
      const dmg = warbandDamage(tier);
      target.hp -= dmg.damage;
    }
  }

  // Dread: chance for wounded enemies to break
  if (combat.dread > 0) {
    combat.enemyWarriors.forEach(e => {
      if (e.hp > 0 && e.hp < e.maxHp * 0.5 && Math.random() < combat.dread * 0.05) {
        e.hp = 0; // breaks and runs
      }
    });
  }

  // Count survivors
  const alliesNow = combat.allyWarriors.filter(w => w.hp > 0).length;
  const enemiesNow = combat.enemyWarriors.filter(w => w.hp > 0).length;
  const allyLoss = combat.alliesAlive - alliesNow;
  const enemyLoss = combat.enemiesAlive - enemiesNow;
  combat.alliesAlive = alliesNow;
  combat.enemiesAlive = enemiesNow;

  let log = '';
  if (enemyLoss > 0 || allyLoss > 0) {
    const parts = [];
    if (allyLoss > 0) parts.push(`<span class="dmg-enemy">${allyLoss} of your men fall.</span>`);
    if (enemyLoss > 0) parts.push(`<span class="dmg-player">${enemyLoss} of theirs go down.</span>`);
    log += `<div class="warband-line">${parts.join(' ')}</div>`;
  }

  return log;
}

function warbandDamage(tier) {
  switch (tier) {
    case 'fumble':      return { damage: 0, stun: false, bleed: false };
    case 'miss':        return { damage: 0, stun: false, bleed: false };
    case 'glancing':    return { damage: rng(1, 2), stun: false, bleed: false };
    case 'solid':       return { damage: rng(3, 4), stun: Math.random() < 0.2, bleed: Math.random() < 0.15 };
    case 'critical':    return { damage: rng(5, 7), stun: Math.random() < 0.4, bleed: Math.random() < 0.3 };
    case 'devastating': return { damage: rng(7, 9), stun: true, bleed: Math.random() < 0.4 };
    default:            return { damage: 0, stun: false, bleed: false };
  }
}

// ─── WARBAND ATTRITION ──────────────────────────────────────────────────
function resolveWarband() {
  if (combat.alliesStart === 0 && combat.enemiesStart <= 1) return ''; // solo/duel — no warband
  return resolveWarbandCombat();
}

// ─── SURRENDER CHECK ────────────────────────────────────────────────────
function checkSurrender() {
  if (combat.boss) return null;
  if (combat.enemiesAlive > 2) return null;
  if (combat.enemyHP > combat.enemyMaxHP * 0.5) return null;

  // Dread makes enemies surrender sooner (even at 3-4 remaining)
  const dreadThreshold = Math.min(4, 2 + combat.dread);
  if (combat.enemiesAlive > dreadThreshold && combat.dread === 0) return null;

  // High dread: enemies might fight to death instead (no mercy expected)
  if (combat.dread >= 4 && Math.random() < 0.4) {
    return `<div class="effect-line" style="color:#e86060">They know your reputation. No surrender — they fight to the death, cornered and desperate.</div>`;
  }

  const texts = [
    "The last of them throw down their weapons. Hands up. Eyes on you.",
    "He drops his blade. Falls to his knees. 'Mercy.' The word comes out broken.",
    "They stop fighting. Shields lowered. Waiting for the word — yours.",
  ];

  let html = `<div class="result" style="color:#c8a96e; border-top:1px solid #555; margin-top:8px; padding-top:8px;">${pick(texts)}</div>`;
  html += `<div class="mercy-choice" id="mercy-choice" style="display:flex;gap:8px;margin-top:8px;">`;
  html += `<button class="stance-btn" onclick="resolveMercy('spare')" style="border-color:#8ab88a">Spare them. Let them go.<span class="stat" style="color:#8ab88a">+1 Nobility</span></button>`;
  html += `<button class="stance-btn" onclick="resolveMercy('execute')" style="border-color:#e86060">No mercy. End it.<span class="stat" style="color:#e86060">+1 Dread</span></button>`;
  html += `</div>`;

  combat.surrenderPending = true;
  return html;
}

// ─── MERCY RESOLUTION ───────────────────────────────────────────────────
function resolveMercy(choice) {
  if (!combat.surrenderPending) return;
  combat.surrenderPending = false;

  document.getElementById('mercy-choice').remove();

  let log = '';
  if (choice === 'spare') {
    combat.nobility++;
    const spareTexts = [
      "You lower your weapon. 'Go.' They scramble to their feet and run. Your men watch in silence. Some nod.",
      "You wave them off. They go — fast, not looking back. Your warriors stand taller. This is what separates a chief from a butcher.",
      "Mercy. The word spreads through both sides. Your men grip their weapons a little less tight. This was the right call. They know it.",
    ];
    log = `<div class="result win" style="color:#8ab88a">${pick(spareTexts)}</div>`;
    log += `<div class="effect-line" style="color:#8ab88a">Nobility rises. You are known for mercy.</div>`;
  } else {
    combat.dread++;
    const executeTexts = [
      "Quick. Efficient. They don't suffer long. Your men say nothing. The silence after is heavier than the fighting.",
      "No mercy. The work is done in minutes. Your warriors clean their blades without meeting each other's eyes. They will remember this.",
      "You give the word. It's over fast. The bodies lie where they fell. Your reputation grows — and darkens.",
    ];
    log = `<div class="result win" style="color:#e86060">${pick(executeTexts)}</div>`;
    log += `<div class="effect-line" style="color:#e86060">Dread rises. They will fear your name.</div>`;
  }

  document.getElementById('log').innerHTML += log;
  scrollLog();
  endCombat('', choice === 'spare' ? 'mercy' : 'execute');
}

// ─── Helper: fire a ranged shot, return {log, tier, atkDmg, killed} ──
function fireRangedShot(label) {
  const w = WEAPONS[combat.player.weapon];
  const roll = rng(1, 100);
  const statVal = combat.player.wits;
  const effective = roll + statVal * 5 - combat.enemy.difficulty * 2;
  const tier = getTier(effective, w.fumble_max);
  const enemySoak = ARMOR_SOAK[combat.enemy.armor] || 0;
  const atkCtx = { armor: combat.enemy.armor, helm: combat.enemy.helm, shield: combat.enemy.shield, weaponName: w.name };
  const entries = PLAYER_ATTACKS[w.crit][tier];
  const entry = pick(entries)(atkCtx);
  let atkDmg = Math.max(0, entry.dmg - enemySoak);
  const fx = entry.fx || null;

  if (entry.kill) combat.enemyHP = -1;
  else combat.enemyHP -= atkDmg;
  if (atkDmg > 0) combat.enemyHitCount++;
  if (fx) {
    if (fx === 'stun') combat.enemyStunned = true;
    if (fx === 'cripple') combat.enemyCrippled = true;
    if (fx === 'bleed_1') combat.enemyBleed += 1;
    if (fx === 'bleed_2') combat.enemyBleed += 2;
  }

  let frag = '';
  if (label) frag += `<div style="color:#999; font-style:italic; margin:4px 0;">${label}</div>`;
  frag += `<span class="tier-tag tier-${tier}">${tier.toUpperCase()}</span> `;
  frag += `<span class="atk">${entry.text}</span>`;
  let dmgLine = '';
  if (atkDmg > 0) dmgLine += `<span class="dmg-player${atkDmg >= 5 ? ' high-dmg' : ''}">[${atkDmg} dmg]</span>`;
  if (enemySoak > 0 && entry.dmg > 0) dmgLine += ` <span class="equip">(${combat.enemy.armor} absorbs ${Math.min(enemySoak, entry.dmg)})</span>`;
  if (fx) dmgLine += fxTag(fx === 'bleed_1' || fx === 'bleed_2' ? 'bleed' : fx);
  if (dmgLine) frag += `<div class="dmg-line">${dmgLine}</div>`;

  return { frag, tier, atkDmg, killed: combat.enemyHP <= 0 };
}

// ─── RANGED → MELEE TRANSITION ──────────────────────────────────────────
function resolveRangedTransition(choice) {
  combat.round++;
  let log = `<div class="log-entry round-start"><div class="round-num">Round ${combat.round}</div>`;

  if (choice === 'drop') {
    // Drop bow, switch to melee — no free hit
    const dropTexts = [
      "You let the bow fall. Hand finds the blade. Familiar weight.",
      "Bow drops. Blade out. He's close now.",
      "No time for another arrow. The blade is faster to the hand.",
    ];
    log += `<div class="status" style="color:#ccc; font-style:normal;">${pick(dropTexts)}</div>`;
    combat.player.weapon = combat.sidearm;
    combat.rangedPhase = false;
    combat.rangedBreakthrough = false;
  } else {
    // ── First shot at the charging enemy ──
    const shot1 = fireRangedShot(null);
    log += shot1.frag;

    if (shot1.killed) {
      log += `<div class="result win">He drops mid-stride. Arrow was enough.</div>`;
      combat.enemiesAlive--;
      if (combat.enemiesAlive <= 0) {
        log += `<div class="result win" style="font-size:1.1em">The field is yours.</div></div>`;
        endCombat(log, 'win');
        return;
      }
      // More enemies — reset, stay ranged, breakthrough resolved
      combat.enemyHP = combat.enemyMaxHP;
      combat.enemyStunned = false; combat.enemyCrippled = false;
      combat.enemyBleed = 0; combat.enemyDisarmed = false;
      combat.enemyHitCount = 0;
      combat.rangedBreakthrough = false;
      log += `<div class="warband-line" style="color:#c8a96e">He's down. You nock another arrow.</div>`;
      // Continue as ranged — warband round, then check next breakthrough
      log += resolveWarband();
      if (combat.alliesStart > 0 && combat.alliesAlive <= 0) {
        log += `<div class="result lose">Your war-band is broken.</div></div>`;
        endCombat(log, 'lose');
        return;
      }
      log += checkRangedBreakthrough();
      log += `<div class="status">${pick(GROUP_STATUS_TEXT[combat.groupStatus])}</div>`;
      log += '</div>';
      document.getElementById('log').innerHTML += log;
      updateBars(); updateWarbandStatus(); showStances();
      scrollLog();
      return;
    }

    if (shot1.atkDmg > 0) {
      // ── Hit but alive — wounded, still coming. Second shot. ──
      const closingTexts = [
        "He staggers. Blood. But he keeps coming. Slower now.",
        "Arrow hit. He stumbles. Doesn't stop. Eyes locked on you.",
        "Wounded. Still running. You reach for another arrow.",
      ];
      log += `<div style="color:#c8a96e; font-style:italic; margin:4px 0;">${pick(closingTexts)}</div>`;

      // Second shot
      const shot2 = fireRangedShot("Second arrow. Last chance.");
      log += shot2.frag;

      if (shot2.killed) {
        log += `<div class="result win">He falls. Two steps from you. Close.</div>`;
        combat.enemiesAlive--;
        if (combat.enemiesAlive <= 0) {
          log += `<div class="result win" style="font-size:1.1em">The field is yours.</div></div>`;
          endCombat(log, 'win');
          return;
        }
        combat.enemyHP = combat.enemyMaxHP;
        combat.enemyStunned = false; combat.enemyCrippled = false;
        combat.enemyBleed = 0; combat.enemyDisarmed = false;
        combat.enemyHitCount = 0;
        combat.rangedBreakthrough = false;
        log += `<div class="warband-line" style="color:#c8a96e">Down. You nock another arrow.</div>`;
        log += resolveWarband();
        if (combat.alliesStart > 0 && combat.alliesAlive <= 0) {
          log += `<div class="result lose">Your war-band is broken.</div></div>`;
          endCombat(log, 'lose');
          return;
        }
        log += checkRangedBreakthrough();
        log += `<div class="status">${pick(GROUP_STATUS_TEXT[combat.groupStatus])}</div>`;
        log += '</div>';
        document.getElementById('log').innerHTML += log;
        updateBars(); updateWarbandStatus(); showStances();
        scrollLog();
        return;
      }

      // Second shot didn't kill — switch to melee, no free hit (you did wound him)
      const switchTexts = [
        "He's on you. Bow drops. Blade out.",
        "Too close. Bow falls. Steel in hand.",
      ];
      log += `<div class="status" style="color:#ccc; font-style:normal;">${pick(switchTexts)}</div>`;
      combat.player.weapon = combat.sidearm;
      combat.rangedPhase = false;
      combat.rangedBreakthrough = false;

    } else {
      // ── First shot missed — he closes. Free hit. ──
      const switchTexts = [
        "Bow drops. Fumble for the blade. He's already here.",
        "Missed. He's on you. Too close for arrows.",
      ];
      log += `<div class="status" style="color:#ccc; font-style:normal;">${pick(switchTexts)}</div>`;
      combat.player.weapon = combat.sidearm;
      combat.rangedPhase = false;
      combat.rangedBreakthrough = false;

      const freeHitTexts = [
        "He's on you before the blade clears the sheath.",
        "Too slow. He closes the gap while you scramble for steel.",
      ];
      log += `<div style="color:#c85050; font-style:italic; margin:4px 0;">${pick(freeHitTexts)}</div>`;
      const c = calcCounter('open', 0, combat.player.strength);
      applyCounter(c);
      log += c.logFrag;
      log += c.fxFrag;
      if (combat.playerHP <= 0) {
        const pDown = checkPlayerDown(log);
        if (pDown.ended) return;
        log = pDown.log;
      }
    }
  }

  // Warband round
  log += resolveWarband();
  if (combat.alliesStart > 0 && combat.alliesAlive <= 0) {
    log += `<div class="result lose">Your war-band is broken.</div></div>`;
    endCombat(log, 'lose');
    return;
  }
  log += `<div class="status">${pick(GROUP_STATUS_TEXT[combat.groupStatus])}</div>`;

  log += '</div>';
  document.getElementById('log').innerHTML += log;
  updateBars(); updateWarbandStatus(); showStances();
  scrollLog();
}

// ─── COMBAT RESOLUTION ──────────────────────────────────────────────────
function resolveRound(stanceId, stat, stanceBonus) {
  combat.round++;
  const w = WEAPONS[combat.player.weapon];
  const ew = ENEMY_WEAPONS[combat.enemy.weapon];

  // Stun recovery
  if (stanceId === 'recover' && combat.playerStunned) {
    combat.playerStunned = false;
  }

  let statVal = combat.player[stat];
  const weaponBonus = combat.player.legend >= 3 ? 2 : combat.player.legend >= 1 ? 1 : 0;

  let log = `<div class="log-entry round-start"><div class="round-num">Round ${combat.round}</div>`;

  // ── Round 1 opening flavor ──
  if (combat.round === 1) {
    const wn = w.name.toLowerCase();
    const dread = combat.dread || 0;
    const nobility = combat.nobility || 0;

    // Disposition-specific openings
    const dreadOpeners = [
      `You bare your teeth. The ${wn} feels light. You've done this before. They know it.`,
      `You lock eyes with the nearest one. He flinches. Good. The ${wn} comes up.`,
      `No war-cry. Just silence and a slow smile. That's worse. They know what's coming.`,
      `You drag a thumb across the ${wn}'s edge. Blood wells. You hold it up. They see.`,
    ];
    const nobilityOpeners = [
      `A prayer to the old gods — brief, earnest. Then the ${wn} comes up. Steady hands.`,
      `You touch the charm at your throat. A word for the fallen. Then forward.`,
      `You raise the ${wn} and call to your men. 'For hearth and kin.' They answer.`,
      `A breath. A promise to come home. The ${wn} feels heavier than it should.`,
    ];

    const openings = {
      forward: dread >= 3
        ? dreadOpeners
        : nobility >= 3
        ? [`You raise the ${wn} high. Your men see it and roar. You charge together.`,
           `'Forward!' The word leaves you like a battle-hymn. The ${wn} leads.`,
           ...nobilityOpeners.slice(0, 1)]
        : [`You grip the ${wn} and storm forward. No hesitation.`,
           `A roar from your throat. You charge. The ${wn} is already moving.`,
           `You spit, tighten your grip, and go straight at him.`,
           `First blood is yours to take. You surge forward, ${wn} raised.`],
      open: dread >= 3
        ? dreadOpeners
        : nobility >= 3
        ? nobilityOpeners
        : [`You settle into the line. ${w.name} up. Steady breathing. Wait for it.`,
           `You roll your shoulders. Test the grip. Eyes on him. Ready.`,
           `You spit in the dirt. Widen your stance. Here it comes.`],
      defensive: dread >= 3
        ? [`Shield up. Eyes flat. Let them come to you. Let them see what waits.`,
           `You stand still. The ${wn} rests easy. Patience is its own threat.`]
        : nobility >= 3
        ? [`Shield up. Weight low. You await the first attack. Calm. Centered.`,
           `A prayer under your breath. Then the shield comes up. Steady.`]
        : [`Shield up. Weight low. You await the first attack.`,
           `You plant your feet and brace. Let them come.`,
           `Steady. Patient. The ${wn} stays close. You wait.`],
      rearward: [`You step behind the line. Sight down the ${wn}. Pick your target.`,
        `From the second rank you watch him. Distance is your weapon now.`,
        `Behind your men, you nock and breathe. The first shot matters most.`],
      recover: [`You steady yourself. Find your footing. Not yet.`],
    };
    const stanceTexts = openings[stanceId] || openings.open;
    log += `<div class="status" style="color:#ccc; font-style:normal;">${pick(stanceTexts)}</div>`;
  }

  // ── Apply start-of-round effects ──
  if (combat.enemyBleed > 0) {
    combat.enemyHP -= combat.enemyBleed;
    log += `<div class="bleed-line">He bleeds. [${combat.enemyBleed} dmg]</div>`;
    if (combat.enemyHP <= 0) {
      log += `<div class="result win">He bleeds out. Falls. Doesn't get up.</div>`;
      combat.enemiesAlive--;
      if (combat.enemiesAlive > 0 && !combat.boss) {
        const nextTexts = [
          "Another steps forward over the body.",
          "No rest. The next one is already here.",
        ];
        log += `<div class="warband-line" style="color:#c8a96e">${pick(nextTexts)}</div>`;
        combat.enemyHP = combat.enemyMaxHP;
        combat.enemyStunned = false;
        combat.enemyCrippled = false;
        combat.enemyBleed = 0;
        combat.enemyDisarmed = false;
        combat.enemyAttackNerfed = false;
        combat.shieldBroken = false;
        combat.enemyHitCount = 0;
        // Don't return — continue the round
      } else {
        log += '</div>';
        endCombat(log, 'win');
        return;
      }
    }
  }
  if (combat.playerBleed > 0) {
    combat.playerHP -= combat.playerBleed;
    log += `<div class="bleed-line">Your wound bleeds. [${combat.playerBleed} dmg to you]</div>`;
    if (combat.playerHP <= 0) {
      log += `<div class="result lose">Blood loss takes you. Knees fold. Darkness.</div>`;
      log += resolveUnconsciousBattle();
      log += '</div>';
      document.getElementById('log').innerHTML += log;
      endCombat('', combat.playerHP > 0 ? 'wounded' : 'lose');
      return;
    }
  }

  // ── Stun recovery log ──
  if (stanceId === 'recover') {
    log += `<div class="stun-line">You stagger upright. Shake it off. Not done yet.</div>`;
  }

  // ── Player cripple penalty ──
  if (combat.playerCrippled) statVal = Math.max(1, statVal - 1);

  // ── Player attack roll ──
  const roll = rng(1, 100);
  const effective = roll + (statVal + weaponBonus + stanceBonus) * 5 - combat.enemy.difficulty * 2;
  const tier = getTier(effective, w.fumble_max);

  // Armor soak on enemy
  const enemySoak = ARMOR_SOAK[combat.enemy.armor] || 0;

  // Context for text generation (enemy's gear)
  const atkCtx = {
    armor: combat.enemy.armor,
    helm: combat.enemy.helm,
    shield: combat.enemy.shield && !combat.shieldBroken,
    weaponName: w.name,
  };

  // Get attack text + effects
  const critType = w.crit;
  const entries = PLAYER_ATTACKS[critType][tier];
  const entry = pick(entries)(atkCtx);
  let atkDmg = Math.max(0, entry.dmg - enemySoak);
  const selfDmg = entry.self || 0;
  const fx = entry.fx || null;

  // Kill flag — text describes unambiguous death, force kill regardless of remaining HP
  if (entry.kill) combat.enemyHP = -1;
  else combat.enemyHP -= atkDmg;
  combat.playerHP -= selfDmg;
  if (atkDmg > 0) combat.enemyHitCount++;

  // ── Grit save: >50% HP loss in one hit → stun check ──
  let gritSaveStun = false;
  if (atkDmg > combat.enemyMaxHP * 0.5 && !combat.enemyStunned && combat.enemyHP > 0) {
    const saveChance = tier === 'devastating' ? 0.2 : tier === 'critical' ? 0.3 : 0.5;
    if (Math.random() > saveChance) {
      combat.enemyStunned = true;
      gritSaveStun = true;
    }
  }

  // ── Apply effects from player attack ──
  if (fx) {
    if (fx === 'stun')         combat.enemyStunned = true;
    if (fx === 'cripple')      combat.enemyCrippled = true;
    if (fx === 'bleed_1')    { combat.enemyBleed += 1; }
    if (fx === 'bleed_2')    { combat.enemyBleed += 2; }
    if (fx === 'shield_break') combat.shieldBroken = true;
    if (fx === 'disarm')       combat.enemyDisarmed = true;
  }

  // ── Build player attack fragment (not appended to log yet) ──
  let pFrag = `<span class="tier-tag tier-${tier}">${tier.toUpperCase()}</span> `;
  pFrag += `<span class="atk">${entry.text}</span>`;
  let dmgLine = '';
  if (atkDmg > 0) dmgLine += `<span class="dmg-player${atkDmg >= 5 ? ' high-dmg' : ''}">[${atkDmg} dmg]</span>`;
  if (enemySoak > 0 && entry.dmg > 0) dmgLine += ` <span class="equip">(${combat.enemy.armor} absorbs ${Math.min(enemySoak, entry.dmg)})</span>`;
  if (selfDmg > 0) dmgLine += `<span class="fumble">[${selfDmg} self-damage]</span>`;
  if (fx) dmgLine += fxTag(fx === 'bleed_1' || fx === 'bleed_2' ? 'bleed' : fx === 'shield_break' ? 'disarm' : fx);
  if (dmgLine) pFrag += `<div class="dmg-line">${dmgLine}</div>`;

  // Player fx description fragment
  let pFxFrag = '';
  if (fx === 'stun')         pFxFrag = `<div class="effect-line">He's down. Stunned. Won't act next round.</div>`;
  if (fx === 'cripple')      pFxFrag = `<div class="effect-line">Crippled. He fights on, but slower, weaker. He knows it.</div>`;
  if (fx === 'bleed_1')      pFxFrag = `<div class="effect-line">Bleeding. The wound won't close. Time works against him now.</div>`;
  if (fx === 'bleed_2')      pFxFrag = `<div class="effect-line">Arterial. Blood pulses from the wound in rhythm with his heart. He has minutes.</div>`;
  if (fx === 'shield_break') pFxFrag = `<div class="effect-line">Shield shattered. His left side is open.</div>`;
  if (fx === 'disarm')       pFxFrag = `<div class="effect-line">Disarmed. Weapon torn from his grip. He stares at empty hands.</div>`;
  if (gritSaveStun && fx !== 'stun') pFxFrag += `<div class="effect-line">The blow staggers him. Eyes glaze. He can't answer — not this round.</div>`;

  // ── Check enemy down ──
  if (combat.enemyHP <= 0) {
    log += pFrag;
    const winTexts = [
      "He falls. Doesn't move. Your men raise a shout.",
      "He crumbles. The fight leaves him all at once.",
      "Down. Still. Your warriors hammer shields and roar.",
      "He drops like a cut rope. The war-band surges forward over his body.",
    ];
    log += `<div class="result win">${pick(winTexts)}</div>`;

    // ── Legend system: escalating kill thresholds ──
    combat.killCount++;
    combat.consecutiveKills++;
    const legendEarned = (combat.legendThresholds.length > 0 && combat.killCount >= combat.legendThresholds[0]) || combat.boss;
    if (legendEarned) {
      if (combat.legendThresholds.length > 0 && combat.killCount >= combat.legendThresholds[0]) combat.legendThresholds.shift();
      combat.player.legend++;
      const wName = WEAPONS[combat.player.weapon].name;
      const legendTexts = combat.boss
        ? [
          `The ${wName} drinks deep. A chieftain's weapon, blooded on a worthy foe.`,
          `${wName} hums. The kill will be remembered. The weapon will make sure of it.`,
          `A kill that matters. The ${wName} is more than iron now.`,
        ]
        : combat.killCount === 1
        ? [
          `First blood. The ${wName} wakes in your hand.`,
          `The ${wName} tastes battle. It remembers.`,
          `One kill. The ${wName} grows warm. It knows what it's for now.`,
        ]
        : [
          `The ${wName} hums. ${combat.killCount} have fallen to it today. It is more than iron and wood now.`,
          `${combat.killCount} kills. The ${wName} grows in legend with every stroke.`,
          `Warriors on both sides watch the ${wName}. They will speak of this.`,
        ];
      log += `<div class="effect-line" style="color:#c8a96e; border-left-color:#c8a96e;"><strong>LEGEND +1</strong> — ${pick(legendTexts)}</div>`;
    }

    combat.enemiesAlive--;

    if (combat.enemiesAlive > 0 && !combat.boss) {
      const nextTexts = [
        "Another steps forward. Fresh. Angry.",
        "Before the body hits the ground, the next one is on you.",
        "No rest. Another takes his place. Weapon up. Eyes locked.",
        "One down. One more. The line pushes another into your path.",
      ];
      log += `<div class="warband-line" style="color:#c8a96e">${pick(nextTexts)}</div>`;
      combat.enemyHP = combat.enemyMaxHP;
      combat.enemyStunned = false;
      combat.enemyCrippled = false;
      combat.enemyBleed = 0;
      combat.enemyDisarmed = false;
      combat.enemyAttackNerfed = false;
      combat.shieldBroken = false;
      combat.enemyHitCount = 0;

      updateGroupMorale(tier);

      // ── Consecutive kills → force morale down ──
      if (combat.consecutiveKills >= 3) {
        combat.groupStatus = 'breaking';
        log += `<div class="effect-line" style="color:#e86060">Fear spreads through their line. Some look for escape routes.</div>`;
      } else if (combat.consecutiveKills >= 2) {
        if (combat.groupStatus === 'strong') combat.groupStatus = 'holding';
        else if (combat.groupStatus === 'holding') combat.groupStatus = 'wavering';
        else if (combat.groupStatus === 'wavering') combat.groupStatus = 'breaking';
        log += `<div class="effect-line" style="color:#e86060">The enemy line hesitates.</div>`;
      }

      // ── Rout check: >50% dead + breaking → flee ──
      if (!combat.boss && combat.groupStatus === 'breaking' && combat.enemiesAlive <= combat.enemiesStart * 0.5) {
        const routTexts = [
          "Their nerve breaks. Weapons clatter to the ground as they scatter.",
          "The last of them turn and run. Your men let them go — or don't.",
          "It's over. Not because you killed them all, but because the rest chose life.",
        ];
        log += `<div class="result win" style="font-size:1.1em">${pick(routTexts)}</div></div>`;
        endCombat(log, 'win');
        return;
      }

      log += resolveWarband();
      if (combat.alliesStart > 0 && combat.alliesAlive <= 0) {
        log += `<div class="result lose">Your war-band is broken. The last of your men fall around you. Alone against many.</div></div>`;
        endCombat(log, 'lose');
        return;
      }
      log += checkRangedBreakthrough();
      log += `<div class="status">${pick(GROUP_STATUS_TEXT[combat.groupStatus])}</div>`;
      log += '</div>';
      document.getElementById('log').innerHTML += log;
      updateBars(); updateWarbandStatus(); showStances();
      scrollLog();
      return;
    } else if (combat.enemiesAlive <= 0) {
      log += `<div class="result win" style="font-size:1.1em">The field is yours. No enemy stands.</div></div>`;
      endCombat(log, 'win');
      return;
    } else {
      log += '</div>';
      endCombat(log, 'win');
      return;
    }
  }

  // ── Enemy counter-attack resolution ──
  const playerCritDev = (tier === 'critical' || tier === 'devastating');
  const hasInitiative = (stanceId === 'forward');

  if (playerCritDev) {
    // Critical/Devastating — no counter, enemy is reeling
    log += pFrag + pFxFrag;
    const noCounterTexts = [
      "He staggers. Can't answer.",
      "He reels. No counter comes.",
      "He's done for the moment. Gasping. Trying to stay upright.",
      "He stumbles back. The blow took everything out of him.",
    ];
    log += `<div style="color:#999; font-style:italic; margin:4px 0;">${pick(noCounterTexts)}</div>`;
  } else if (combat.enemyStunned) {
    // Stunned — no counter
    log += pFrag + pFxFrag;
    log += `<br><br><span class="stun-line">He's on the ground. No counter-attack.</span>`;
  } else if (combat.enemyDisarmed) {
    // Disarmed — show player attack first, then handle disarm
    log += pFrag + pFxFrag;
    if (combat.enemiesAlive > 2) {
      const disarmTexts = [
        "Weaponless, he stumbles back into the press. Another takes his place.",
        "He scrambles for a fallen blade. Your next opponent is already here.",
        "Disarmed. He backs away. The line pushes a fresh fighter toward you.",
      ];
      log += `<br><br><div class="warband-line" style="color:#c8a96e">${pick(disarmTexts)}</div>`;
      combat.enemiesAlive--;
      combat.enemyHP = combat.enemyMaxHP;
      combat.enemyStunned = false;
      combat.enemyCrippled = false;
      combat.enemyBleed = 0;
      combat.enemyDisarmed = false;
      combat.enemyAttackNerfed = false;
      combat.shieldBroken = false;
      combat.enemyHitCount = 0;
    } else {
      const disarmResult = resolveDisarm(log);
      log = disarmResult.log;
      if (disarmResult.ended) return;
      // Fight on with fists — no reorder for this edge case
      const c = calcCounter(stanceId, stanceBonus, statVal, 'fists');
      applyCounter(c);
      log += c.logFrag;
      const pDown = checkPlayerDown(log);
      if (pDown.ended) return;
      log = pDown.log;
      log += c.fxFrag;
    }
  } else if (hasInitiative) {
    // ── Forward initiative — player always strikes first ──
    // Player attack already resolved above; if enemy survived, counter comes after
    log += pFrag + pFxFrag;
    const c = calcCounter(stanceId, stanceBonus, statVal);
    applyCounter(c);
    log += c.logFrag;
    log += c.fxFrag;

    const pDown = checkPlayerDown(log);
    if (pDown.ended) return;
    log = pDown.log;
  } else {
    // ── Normal counter — order by damage (lighter first) ──
    const c = calcCounter(stanceId, stanceBonus, statVal);

    if (atkDmg > 0 && c.dmg > 0) {
      // Both hit — show lighter first, transition, then heavier
      if (c.dmg <= atkDmg) {
        // Enemy hit is lighter → show enemy first, transition (player shrugs it off), then player attack
        applyCounter(c);
        log += c.logFrag;
        log += pickTransition('player', c.dmg);
        log += pFrag + pFxFrag;
        log += c.fxFrag;
      } else {
        // Player hit is lighter → show player first, transition (enemy shrugs it off), then enemy counter
        log += pFrag + pFxFrag;
        log += pickTransition('enemy', atkDmg);
        applyCounter(c);
        log += c.logFrag;
        log += c.fxFrag;
      }
    } else {
      // One or both missed — default order, no transition
      log += pFrag + pFxFrag;
      applyCounter(c);
      log += c.logFrag;
      log += c.fxFrag;
    }

    // Check player down after counter
    const pDown = checkPlayerDown(log);
    if (pDown.ended) return;
    log = pDown.log;
  }

  // Update group morale
  updateGroupMorale(tier);

  // ── Warband attrition ──
  log += resolveWarband();

  // ── Warband wipe checks (skip for solo combat) ──
  if (combat.alliesStart > 0 && combat.alliesAlive <= 0) {
    log += `<div class="result lose">Your war-band is broken. The last of your men fall around you. Alone against many.</div></div>`;
    endCombat(log, 'lose');
    return;
  }
  if (combat.enemiesStart > 1 && combat.enemiesAlive <= 0 && combat.enemyHP > 0) {
    log += `<div class="result win">Their line collapses. The last of them scatter. Only your opponent remains — and he knows it's over.</div>`;
    combat.enemy.attack = Math.max(1, combat.enemy.attack - 1);
  }

  // ── Surrender check ──
  const surrenderResult = checkSurrender();
  if (surrenderResult) {
    log += surrenderResult;
    log += `<div class="status">${pick(GROUP_STATUS_TEXT[combat.groupStatus])}</div>`;
    log += '</div>';
    document.getElementById('log').innerHTML += log;
    updateBars(); updateWarbandStatus();
    scrollLog();
    return;
  }

  log += `<div class="status">${pick(GROUP_STATUS_TEXT[combat.groupStatus])}</div>`;

  // ── Ranged breakthrough check ──
  log += checkRangedBreakthrough();

  log += '</div>';
  document.getElementById('log').innerHTML += log;
  updateBars(); updateWarbandStatus(); showStances();
  scrollLog();
}

// ── Ranged breakthrough check ──
function checkRangedBreakthrough() {
  if (!combat.rangedPhase || combat.rangedBreakthrough) return '';
  // Solo: immediate breakthrough
  if (combat.alliesStart === 0) {
    combat.rangedBreakthrough = true;
    return '<div style="color:#c85050; font-style:italic; margin-top:4px;">No line to hold. He\'s coming straight for you.</div>';
  }
  // Overmatch: no breakthrough possible
  if (combat.alliesAlive >= combat.enemiesAlive) return '';
  // Chance = (enemies - allies) / enemies
  const chance = (combat.enemiesAlive - combat.alliesAlive) / combat.enemiesAlive;
  if (Math.random() < chance) {
    combat.rangedBreakthrough = true;
    const texts = [
      "One slips through the line. Eyes on you. Running.",
      "Your men can't hold them all. One breaks free. He sees the bow.",
      "A gap in the shield wall. An enemy surges through. Headed your way.",
    ];
    return `<div style="color:#c85050; font-style:italic; margin-top:4px;">${pick(texts)}</div>`;
  }
  return '';
}

// ── Transition texts between lighter and heavier hit ──
function pickTransition(whoShrugs, lightDmg) {
  let texts;
  if (whoShrugs === 'player') {
    texts = lightDmg <= 2
      ? ["You shrug it off.", "Barely felt.", "You don't flinch.", "A scratch. Nothing more."]
      : ["You spit. Grin.", "You grit your teeth. Step forward.", "Pain. But you've had worse.", "You spit blood. Keep your feet."];
  } else {
    texts = lightDmg <= 2
      ? ["He shrugs it off.", "He barely notices.", "He doesn't slow.", "It won't stop him."]
      : ["He holds on.", "He cries out but stands.", "He staggers. Steadies.", "He grits his teeth. Comes back harder."];
  }
  return `<div style="color:#999; font-style:italic; margin:4px 0;">${pick(texts)}</div>`;
}

// ── Calculate enemy counter (pure, no side effects) ──
function calcCounter(stanceId, stanceBonus, statVal, weaponOverride) {
  const wKey = weaponOverride || combat.enemy.weapon;
  const ew = ENEMY_WEAPONS[wKey];
  const counterRoll = rng(1, 100);
  let counterEff = counterRoll + combat.enemy.attack * 10 - (statVal + stanceBonus) * 3;
  const defBonus = (stanceId === 'defensive' || stanceId === 'recover') ? -15 : stanceId === 'rearward' ? -20 : 0;
  counterEff += defBonus;
  if (combat.enemyCrippled) counterEff -= 15;

  const counterTier = getTier(counterEff, 5);
  const defCtx = { armor: combat.player.armor, helm: combat.player.helm, shield: combat.player.shield, weaponName: ew.name };
  const counterCrit = ew.crit;
  const counterEntries = ENEMY_ATTACKS[counterCrit]?.[counterTier] || ENEMY_ATTACKS.crush[counterTier];
  const counterEntry = pick(counterEntries)(defCtx);
  let counterDmg = counterEntry.dmg;
  const counterFx = counterEntry.fx || null;

  const playerSoak = ARMOR_SOAK[combat.player.armor] || 0;
  if (combat.player.shield && counterDmg > 0) counterDmg = Math.max(0, counterDmg - 1);
  counterDmg = Math.max(0, counterDmg - playerSoak);

  // Build log fragment
  let logFrag = `<br><br><span class="tier-tag tier-${counterTier}">${counterTier.toUpperCase()}</span> `;
  logFrag += `<span class="def">${counterEntry.text}</span>`;
  let cDmgLine = '';
  if (counterDmg > 0) cDmgLine += `<span class="dmg-enemy${counterDmg >= 5 ? ' high-dmg' : ''}">[${counterDmg} dmg to you]</span>`;
  if (playerSoak > 0 && counterEntry.dmg > 0) cDmgLine += ` <span class="equip">(${combat.player.armor} absorbs ${Math.min(playerSoak, counterEntry.dmg)})</span>`;
  if (combat.player.shield && counterEntry.dmg > 0) cDmgLine += ` <span class="equip">(shield blocks 1)</span>`;
  if (counterFx) cDmgLine += fxTag(counterFx === 'bleed_1' || counterFx === 'bleed_2' ? 'bleed' : counterFx);
  if (cDmgLine) logFrag += `<div class="dmg-line">${cDmgLine}</div>`;

  // Build fx description fragment
  let fxFrag = '';
  if (counterFx === 'stun')    fxFrag = `<div class="effect-line">Your vision swims. Stunned — you lose next round.</div>`;
  if (counterFx === 'cripple') fxFrag = `<div class="effect-line">Something is wrong inside. You fight on, but diminished.</div>`;
  if (counterFx === 'bleed_1') fxFrag = `<div class="effect-line">Bleeding. The wound leaks steadily. You feel it with every heartbeat.</div>`;
  if (counterFx === 'bleed_2') fxFrag = `<div class="effect-line">Bleeding badly. The warmth spreading down your side is your life leaving.</div>`;

  return { tier: counterTier, dmg: counterDmg, fx: counterFx, logFrag, fxFrag };
}

// ── Apply counter effects to combat state ──
function applyCounter(c) {
  combat.playerHP -= c.dmg;
  if (c.dmg > 3) combat.consecutiveKills = 0;
  if (c.fx) {
    if (c.fx === 'stun')      combat.playerStunned = true;
    if (c.fx === 'cripple')   combat.playerCrippled = true;
    if (c.fx === 'bleed_1') { combat.playerBleed += 1; }
    if (c.fx === 'bleed_2') { combat.playerBleed += 2; }
  }
}

// ── Check player unconscious after counter ──
function checkPlayerDown(log) {
  if (combat.playerHP <= 0) {
    const unconsciousTexts = [
      "Darkness. The ground takes you. Voices fade.",
      "Everything goes distant. Someone is pulling you by the arms. Then nothing.",
      "Your knees fold. The sky tilts. The world goes dark.",
      "You go down. The last thing you see is your men closing ranks over your body.",
    ];
    log += `<div class="result lose">${pick(unconsciousTexts)}</div>`;
    log += resolveUnconsciousBattle();
    log += '</div>';
    document.getElementById('log').innerHTML = (document.getElementById('log').innerHTML || '') + log;
    endCombat('', combat.playerHP > 0 ? 'wounded' : 'lose');
    return { log, ended: true };
  }
  return { log, ended: false };
}

function calcFleeChance() {
  let chance = 0.4;
  const hpRatio = combat.enemyHP / combat.enemyMaxHP;
  if (hpRatio < 0.3) chance += 0.3;
  else if (hpRatio < 0.5) chance += 0.15;
  chance += combat.dread * 0.06;
  if (combat.boss) chance = 0;
  return Math.min(0.85, chance);
}

function resolveDisarm(log) {
  const fleeChance = calcFleeChance();
  const roll = Math.random();

  if (roll < fleeChance * 0.5) {
    // Surrender
    const texts = [
      "Weaponless. He drops to his knees. Hands up. Done.",
      "Without a weapon, the fight leaves him. He kneels. Waiting.",
      "He looks at his empty hands. Then at you. Slowly, he kneels.",
    ];
    log += `<br><br><div class="result" style="color:#c8a96e; border-top:1px solid #555; margin-top:8px; padding-top:8px;">${pick(texts)}</div>`;
    log += `<div class="mercy-choice" id="mercy-choice" style="display:flex;gap:8px;margin-top:8px;">`;
    log += `<button class="stance-btn" onclick="resolveMercy('spare')" style="border-color:#8ab88a">Spare him.<span class="stat" style="color:#8ab88a">+1 Nobility</span></button>`;
    log += `<button class="stance-btn" onclick="resolveMercy('execute')" style="border-color:#e86060">No mercy.<span class="stat" style="color:#e86060">+1 Dread</span></button>`;
    log += `</div>`;
    combat.surrenderPending = true;
    log += '</div>';
    document.getElementById('log').innerHTML += log;
    updateBars(); updateWarbandStatus();
    scrollLog();
    return { log, ended: true };
  } else if (roll < fleeChance) {
    // Flee
    const texts = [
      "Without his weapon, he runs. Turns and sprints. Your men let him go — or don't.",
      "He scrambles backward, weaponless. Trips. Gets up. Runs.",
      "No weapon, no courage. He breaks and runs.",
    ];
    log += `<br><br><div class="result win">${pick(texts)}</div></div>`;
    endCombat(log, 'win');
    return { log, ended: true };
  } else {
    // Fight on with fists
    log += `<br><br><div class="stun-line">Weaponless. He fights on with bare hands — desperate, clumsy.</div>`;
    if (!combat.enemyAttackNerfed) {
      combat.enemy.attack = Math.max(1, combat.enemy.attack - 2);
      combat.enemyAttackNerfed = true;
    }
    return { log, ended: false };
  }
}

// ─── UNCONSCIOUS BATTLE RESOLUTION ─────────────────────────────────────
function resolveUnconsciousBattle() {
  let log = '';
  // Simulate remaining rounds using real combat rules
  let rounds = 0;
  const maxRounds = 30; // safety cap

  while (combat.alliesAlive > 0 && combat.enemiesAlive > 0 && rounds < maxRounds) {
    rounds++;
    // Run one round of real warband combat
    resolveWarbandCombat();

    // Without chieftain, morale penalty — wounded allies more likely to fall
    combat.allyWarriors.forEach(a => {
      if (a.hp > 0 && a.hp < a.maxHp * 0.4 && Math.random() < 0.1) {
        a.hp = 0; // breaks without leadership
      }
    });
    combat.alliesAlive = combat.allyWarriors.filter(w => w.hp > 0).length;
    combat.enemiesAlive = combat.enemyWarriors.filter(w => w.hp > 0).length;
  }

  if (combat.alliesAlive > 0 && combat.enemiesAlive <= 0) {
    // Warband wins — chieftain survives wounded
    const wakeHP = Math.max(1, Math.floor(combat.playerMaxHP * 0.2));
    combat.playerHP = wakeHP;
    const wakeTexts = [
      `You wake to voices. Your men won. The field is yours. Everything hurts. [${wakeHP}/${combat.playerMaxHP} HP]`,
      `Light returns. Faces above you. Worried. Then relieved. You're alive. Barely. [${wakeHP}/${combat.playerMaxHP} HP]`,
      `Someone is pouring water on your face. You cough. The fighting is over. Your men carried you through. [${wakeHP}/${combat.playerMaxHP} HP]`,
    ];
    log += `<div class="result win" style="color:#c8a96e">${pick(wakeTexts)}</div>`;
    log += `<div class="warband-line">Your men: ${combat.alliesAlive}/${combat.alliesStart} standing. All enemies down.</div>`;
  } else if (combat.alliesAlive > 0) {
    // Stalemate — warband retreats with unconscious chief
    const wakeHP = Math.max(1, Math.floor(combat.playerMaxHP * 0.15));
    combat.playerHP = wakeHP;
    const retreatTexts = [
      `Your men drag you from the field. The enemy doesn't pursue. Both sides had enough. [${wakeHP}/${combat.playerMaxHP} HP]`,
      `You wake on a stretcher. Moving. Trees above. Your men are retreating. The fight was a draw. [${wakeHP}/${combat.playerMaxHP} HP]`,
    ];
    log += `<div class="result stalemate">${pick(retreatTexts)}</div>`;
    log += `<div class="warband-line">Your men: ${combat.alliesAlive}/${combat.alliesStart}. Enemies: ${combat.enemiesAlive}/${combat.enemiesStart}. Retreated.</div>`;
  } else {
    // Warband wiped — true defeat
    combat.playerHP = 0;
    const defeatTexts = [
      "Your men fight on without you. Brave. Doomed. When the last one falls, the field belongs to the enemy.",
      "Without their chief, the line breaks. They fight in knots, then alone, then not at all.",
      "The warband dies around your body. The enemy strips the dead. You are carried away — to slavery, or worse.",
    ];
    log += `<div class="result lose">${pick(defeatTexts)}</div>`;
    log += `<div class="warband-line">Your men: 0/${combat.alliesStart}. Total defeat.</div>`;
  }

  return log;
}

function scrollLog() {
  const logEl = document.getElementById('log');
  logEl.scrollTop = logEl.scrollHeight;
}

function getTier(effective, fumbleMax) {
  if (effective <= fumbleMax) return 'fumble';
  if (effective <= 25) return 'miss';
  if (effective <= 50) return 'glancing';
  if (effective <= 75) return 'solid';
  if (effective <= 90) return 'critical';
  return 'devastating';
}

function updateGroupMorale(tier) {
  const s = combat.groupStatus;
  const heart = combat.player.heart;
  const missHolding = heart >= 2 ? 'holding' : 'wavering';
  const fumbleWavering = heart >= 3 ? 'wavering' : 'breaking';
  const transitions = {
    devastating: { strong:'strong', holding:'strong', wavering:'strong', breaking:'strong' },
    critical:    { strong:'strong', holding:'strong', wavering:'strong', breaking:'strong' },
    solid:       { strong:'strong', holding:'holding', wavering:'holding', breaking:'wavering' },
    glancing:    { strong:s, holding:s, wavering:s, breaking:s },
    miss:        { strong:'holding', holding:missHolding, wavering:'wavering', breaking:'wavering' },
    fumble:      { strong:'wavering', holding:'wavering', wavering:fumbleWavering, breaking:'breaking' },
  };
  combat.groupStatus = transitions[tier]?.[s] || s;
}

function endCombat(log, result) {
  combat.ended = true;
  if (log) document.getElementById('log').innerHTML += log;
  document.getElementById('stances').innerHTML = '';
  updateBars();
  updateWarbandStatus();
  // Show final warband status
  const finalStatus = `<div class="warband-line" style="margin-top:8px;">Allies remaining: ${combat.alliesAlive}/${combat.alliesStart}. Enemies remaining: ${combat.enemiesAlive}/${combat.enemiesStart}.</div>`;
  document.getElementById('log').innerHTML += finalStatus;
  document.getElementById('btn-start').disabled = false;
  scrollLog();
}

// ── Headless simulation (call from console) ──
function simFight(weaponKey, stanceId, statVal, stanceBonus, enemy, N) {
  const w = WEAPONS[weaponKey];
  const ew = ENEMY_WEAPONS[enemy.weapon];
  let wins = 0;
  for (let i = 0; i < N; i++) {
    let pHP = 12, eHP = enemy.hp;
    let eCrippled = false, pCrippled = false;
    let eStunned = false, pStunned = false;
    let eBleed = 0, pBleed = 0;
    let round = 0;
    while (pHP > 0 && eHP > 0 && round < 50) {
      round++;
      // Bleeds
      if (eBleed > 0) { eHP -= eBleed; if (eHP <= 0) break; }
      if (pBleed > 0) { pHP -= pBleed; if (pHP <= 0) break; }
      // Player stun skip
      if (pStunned) { pStunned = false; continue; }
      // Player cripple
      const sv = pCrippled ? Math.max(1, statVal - 1) : statVal;
      // Player attack
      const roll = rng(1, 100);
      const eff = roll + (sv + stanceBonus) * 5 - enemy.difficulty * 2;
      const tier = getTier(eff, w.fumble_max);
      const dmgRange = w.dmg[tier] || [0,0];
      let atkDmg = (tier === 'fumble' || tier === 'miss') ? 0 : rng(dmgRange[0], dmgRange[1]);
      const enemySoak = ARMOR_SOAK[enemy.armor] || 0;
      atkDmg = Math.max(0, atkDmg - enemySoak);
      // Fumble self-dmg
      if (tier === 'fumble') pHP -= rng(w.self_dmg[0], w.self_dmg[1]);
      // Simple fx chance on critical/devastating
      if (tier === 'critical' || tier === 'devastating') {
        const fxRoll = Math.random();
        if (fxRoll < 0.2) eStunned = true;
        else if (fxRoll < 0.35) eCrippled = true;
        else if (fxRoll < 0.5) eBleed += 1;
      }
      // Kill flag: devastating always kills, critical ~40% chance
      if (tier === 'devastating') eHP = -1;
      else eHP -= atkDmg;
      if (eHP <= 0) break;
      // Grit save: >50% HP loss in one hit → stun chance
      if (atkDmg > enemy.hp * 0.5 && !eStunned) {
        const saveChance = tier === 'devastating' ? 0.2 : tier === 'critical' ? 0.3 : 0.5;
        if (Math.random() > saveChance) eStunned = true;
      }
      // Forward initiative: if player killed enemy above, no counter (break already happened)
      // Critical/Devastating: no counter
      if (tier === 'critical' || tier === 'devastating') continue;
      // Stunned enemy: no counter
      if (eStunned) continue;
      // Enemy counter
      const cRoll = rng(1, 100);
      let cEff = cRoll + enemy.attack * 10 - (sv + stanceBonus) * 3;
      const defBonus = (stanceId === 'defensive') ? -15 : stanceId === 'rearward' ? -20 : 0;
      cEff += defBonus;
      if (eCrippled) cEff -= 15;
      const cTier = getTier(cEff, 5);
      // Enemy damage (simplified: use fixed ranges by tier)
      const eDmgTable = { fumble:[0,0], miss:[0,0], glancing:[1,2], solid:[3,4], critical:[5,6], devastating:[7,8] };
      let cDmg = (cTier === 'fumble' || cTier === 'miss') ? 0 : rng(eDmgTable[cTier][0], eDmgTable[cTier][1]);
      const pSoak = ARMOR_SOAK['leather'] || 0;
      cDmg = Math.max(0, cDmg - pSoak);
      if (cTier === 'critical' || cTier === 'devastating') {
        const cfx = Math.random();
        if (cfx < 0.2) pStunned = true;
        else if (cfx < 0.35) pCrippled = true;
        else if (cfx < 0.5) pBleed += 1;
      }
      pHP -= cDmg;
    }
    if (pHP > 0 && eHP <= 0) wins++;
  }
  return wins;
}

function runBalanceTest() {
  const N = 5000;
  const meleeWeapons = ['dagger','hunting_knife','shortsword','longsword','spear','javelin','hand_axe','battle_axe','hammer','club'];
  const stances = [
    { id:'forward',   label:'Forward',          stat:'strength', bonus:1, statVal:2 },
    { id:'open',      label:'Open',             stat:'strength', bonus:0, statVal:2 },
    { id:'defensive', label:'Defensive(shield)', stat:'grit',    bonus:2, statVal:2 },
    { id:'defensive', label:'Defensive(no shd)', stat:'grit',    bonus:0, statVal:2 },
  ];
  const enemy = { hp:8, attack:2, difficulty:6, armor:'none', weapon:'bone_club' };

  console.log(`\n=== BALANCE TEST (${N} fights each) ===`);
  console.log(`Enemy: HP ${enemy.hp}, ATK ${enemy.attack}, DIFF ${enemy.difficulty}, ${enemy.armor}`);
  console.log(`Player: HP 12, Stat 2, Leather armor\n`);

  let header = 'Weapon'.padEnd(14);
  stances.forEach(s => header += s.label.padStart(18));
  console.log(header);
  console.log('-'.repeat(header.length));

  for (const wk of meleeWeapons) {
    let row = WEAPONS[wk].name.padEnd(14);
    for (const s of stances) {
      // 2H weapons cannot use shield
      if (WEAPONS[wk].twoHanded && s.bonus === 2 && s.id === 'defensive') {
        row += '---'.padStart(18);
        continue;
      }
      const wins = simFight(wk, s.id, s.statVal, s.bonus, enemy, N);
      row += `${(wins/N*100).toFixed(1)}%`.padStart(18);
    }
    console.log(row);
  }

  // Stat distribution comparison for Battle Axe
  console.log(`\n=== STAT DISTRIBUTION — Battle Axe ===`);
  const statTests = [
    { label:'Str3/Grit1 Forward',  id:'forward',   bonus:1, statVal:3 },
    { label:'Str1/Grit3 Forward',  id:'forward',   bonus:1, statVal:1 },
    { label:'Str3/Grit1 Def(no shd)', id:'defensive', bonus:0, statVal:1 },
    { label:'Str1/Grit3 Def(no shd)', id:'defensive', bonus:0, statVal:3 },
    { label:'Str2/Grit2 Forward',  id:'forward',   bonus:1, statVal:2 },
    { label:'Str2/Grit2 Def(no shd)', id:'defensive', bonus:0, statVal:2 },
  ];
  for (const st of statTests) {
    const wins = simFight('battle_axe', st.id, st.statVal, st.bonus, enemy, N);
    console.log(`  ${st.label.padEnd(24)} ${(wins/N*100).toFixed(1)}%`);
  }
}
