<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chronicle Sim — Combat Test</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #1a1a1e; color: #d4cfc4; font-family: 'Segoe UI', sans-serif; font-size: 15px; line-height: 1.5; }
h1 { font-size: 18px; color: #c8a96e; margin-bottom: 8px; }
h2 { font-size: 14px; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }

.app { max-width: 900px; margin: 0 auto; padding: 12px; }

/* Setup panels */
.setup { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.setup-panel { flex: 1; background: #222228; border: 1px solid #333; border-radius: 6px; padding: 12px; }
.setup-panel.player { border-color: #4a6a4a; }
.setup-panel.enemy  { border-color: #6a4a4a; }
.setup-panel.battle { border-color: #6a6a4a; }

.field { margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.field label { width: 70px; font-size: 13px; color: #999; }
.field select, .field input[type=range] { flex: 1; }
.field .val { width: 20px; text-align: center; font-size: 13px; color: #c8a96e; }

select { background: #2a2a30; color: #d4cfc4; border: 1px solid #444; border-radius: 3px; padding: 4px 6px; font-size: 13px; }
input[type=range] { accent-color: #c8a96e; }

.checks { display: flex; gap: 12px; margin-top: 4px; }
.checks label { font-size: 13px; color: #aaa; cursor: pointer; display: flex; align-items: center; gap: 4px; }
input[type=checkbox] { accent-color: #c8a96e; }

/* Combat area */
.combat-area { background: #222228; border: 1px solid #333; border-radius: 6px; padding: 12px; margin-bottom: 12px; }

.hp-bars { display: flex; gap: 16px; margin-bottom: 10px; }
.hp-bar { flex: 1; }
.hp-bar .label { font-size: 12px; color: #888; margin-bottom: 2px; }
.hp-bar .bar { height: 18px; background: #333; border-radius: 3px; overflow: hidden; position: relative; }
.hp-bar .fill { height: 100%; transition: width 0.3s; border-radius: 3px; }
.hp-bar .fill.player { background: #4a8a4a; }
.hp-bar .fill.enemy  { background: #8a4a4a; }
.hp-bar .text { position: absolute; right: 6px; top: 0; font-size: 11px; line-height: 18px; color: #ccc; }

.warband-status { font-size: 14px; color: #aaa; margin-bottom: 8px; padding: 6px 10px; background: #1e1e22; border-radius: 4px; border: 1px solid #333; }
.warband-status span { color: #c8a96e; font-weight: bold; }
.warband-status .forces { color: #d4cfc4; font-weight: bold; font-size: 15px; }

/* Stances */
.stances { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
.stance-btn { padding: 8px 14px; background: #2a2a30; border: 1px solid #555; border-radius: 4px;
  color: #d4cfc4; cursor: pointer; font-size: 13px; transition: all 0.15s; flex: 1; text-align: center; min-width: 120px; }
.stance-btn:hover { background: #3a3a40; border-color: #c8a96e; }
.stance-btn:disabled { opacity: 0.3; cursor: default; border-color: #333; }
.stance-btn .stat { font-size: 11px; color: #888; display: block; }

/* Combat log */
.log { max-height: 500px; overflow-y: auto; }
.log-entry { margin-bottom: 12px; padding: 10px; background: #1a1a1e; border-radius: 4px; border-left: 3px solid #333; }
.log-entry.round-start { border-left-color: #c8a96e; }
.log-entry .round-num { font-size: 12px; color: #c8a96e; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
.log-entry .atk { color: #ccc; }
.log-entry .def { color: #ccc; }
.log-entry .dmg { color: #c8a96e; font-weight: bold; }
.dmg-line { margin-top: 3px; }
.log-entry .dmg-player { color: #3a9a7a; font-weight: bold; }
.log-entry .dmg-enemy { color: #c85050; font-weight: bold; }
.high-dmg { font-weight: bold; font-size: 1.05em; }
.log-entry .equip { color: #7a9ab8; font-style: italic; }
.log-entry .fumble { color: #b86a6a; }
.log-entry .status { color: #888; font-style: italic; margin-top: 4px; font-size: 15px; }
.log-entry .result { margin-top: 8px; padding-top: 8px; border-top: 1px solid #333; font-weight: bold; }
.log-entry .result.win { color: #8ab88a; }
.log-entry .result.lose { color: #b86a6a; }
.log-entry .result.stalemate { color: #b8a86a; }

/* Buttons */
.controls { display: flex; gap: 8px; margin-bottom: 12px; }
.btn { padding: 10px 20px; background: #c8a96e; color: #1a1a1e; border: none; border-radius: 4px;
  font-size: 14px; font-weight: bold; cursor: pointer; }
.btn:hover { background: #d4b97e; }
.btn.secondary { background: #444; color: #ccc; }
.btn.secondary:hover { background: #555; }
.btn:disabled { opacity: 0.4; cursor: default; }

.tier-tag { display: inline-block; padding: 1px 6px; border-radius: 2px; font-size: 11px; font-weight: bold; margin-right: 4px; }
.tier-fumble { background: #4a2020; color: #d88; }
.tier-miss { background: #3a3020; color: #b98; }
.tier-glancing { background: #2a3520; color: #9b8; }
.tier-solid { background: #204a20; color: #8c8; }
.tier-critical { background: #204a4a; color: #8cc; }
.tier-devastating { background: #3a204a; color: #c8c; }

.fx-tag { display: inline-block; padding: 1px 6px; border-radius: 2px; font-size: 11px; font-weight: bold; margin-left: 4px; }
.fx-tag * { font-weight: bold; }
.fx-stun { background: #4a3a10; color: #e8c840; }
.fx-cripple { background: #4a1020; color: #e86060; }
.fx-bleed { background: #3a1010; color: #c84040; }
.fx-disarm { background: #2a2a40; color: #8888cc; }

.effect-line { font-size: 13px; margin-top: 4px; padding: 3px 8px; border-left: 2px solid #c8a96e; color: #c8a96e; font-style: italic; font-weight: bold; }
.bleed-line { color: #b22222; font-size: 13px; font-style: italic; margin-bottom: 4px; font-weight: bold; }
.stun-line { color: #e8c840; font-size: 13px; font-style: italic; margin-bottom: 4px; font-weight: bold; }

.warband-line { font-size: 13px; color: #aaa; margin-top: 4px; }
</style>
</head>
<body>
<div class="app">
<h1>Combat Test — Chronicle Sim</h1>

<div class="setup">
  <div class="setup-panel player">
    <h2>Player (Chieftain)</h2>
    <div class="field"><label>Weapon</label>
      <select id="p-weapon">
        <option value="dagger">Dagger</option>
        <option value="hunting_knife">Hunting Knife</option>
        <option value="shortsword">Shortsword</option>
        <option value="longsword">Longsword</option>
        <option value="spear" selected>Spear</option>
        <option value="javelin">Javelin</option>
        <option value="hand_axe">Hand Axe</option>
        <option value="battle_axe">Battle Axe</option>
        <option value="hammer">Hammer</option>
        <option value="club">Club</option>
        <option value="bow">Bow</option>
        <option value="sling">Sling</option>
      </select></div>
    <div class="field" id="sidearm-field" style="display:none"><label>Sidearm</label>
      <select id="p-sidearm">
        <option value="dagger">Dagger</option>
        <option value="hunting_knife">Hunting Knife</option>
        <option value="shortsword" selected>Shortsword</option>
        <option value="hand_axe">Hand Axe</option>
      </select></div>
    <div class="field"><label>Armor</label>
      <select id="p-armor"><option value="none">None</option><option value="leather">Leather</option><option value="bronze">Bronze (Scale)</option></select></div>
    <div class="checks">
      <label><input type="checkbox" id="p-shield"> Shield</label>
      <label><input type="checkbox" id="p-helm"> Helm</label>
    </div>
    <div class="field"><label>Strength</label><input type="range" id="p-strength" min="1" max="5" value="3"><span class="val" id="p-strength-v">3</span></div>
    <div class="field"><label>Wits</label><input type="range" id="p-wits" min="1" max="5" value="2"><span class="val" id="p-wits-v">2</span></div>
    <div class="field"><label>Grit</label><input type="range" id="p-grit" min="1" max="5" value="2"><span class="val" id="p-grit-v">2</span></div>
    <div class="field"><label>Heart</label><input type="range" id="p-heart" min="1" max="5" value="2"><span class="val" id="p-heart-v">2</span></div>
    <div class="field"><label>Legend</label><input type="range" id="p-legend" min="0" max="5" value="0"><span class="val" id="p-legend-v">0</span></div>
  </div>

  <div class="setup-panel enemy">
    <h2>Enemy</h2>
    <div class="field"><label>Type</label>
      <select id="e-type"><option value="ashkin">Ashkin Raider</option><option value="bandit">Bandit</option>
        <option value="wolf">Wolf Pack</option><option value="guard">Armored Guard</option></select></div>
    <div class="field"><label>Weapon</label>
      <select id="e-weapon">
        <option value="bone_club">Bone Club</option>
        <option value="stone_axe">Stone Axe</option>
        <option value="rusty_sword">Rusty Sword</option>
        <option value="bronze_sword">Bronze Sword</option>
        <option value="broadsword">Broadsword</option>
        <option value="spear">Spear</option>
        <option value="hammer">Hammer</option>
        <option value="teeth">Teeth & Claws</option>
      </select></div>
    <div class="field"><label>Armor</label>
      <select id="e-armor"><option value="none">None</option><option value="leather">Leather</option><option value="bronze">Bronze (Scale)</option></select></div>
    <div class="checks">
      <label><input type="checkbox" id="e-shield"> Shield</label>
      <label><input type="checkbox" id="e-helm"> Helm</label>
    </div>
    <div class="field"><label>HP</label><input type="range" id="e-hp" min="4" max="20" value="12"><span class="val" id="e-hp-v">12</span></div>
    <div class="field"><label>Attack</label><input type="range" id="e-attack" min="1" max="5" value="3"><span class="val" id="e-attack-v">3</span></div>
    <div class="field"><label>Difficulty</label><input type="range" id="e-diff" min="2" max="12" value="7"><span class="val" id="e-diff-v">7</span></div>
  </div>

  <div class="setup-panel battle" style="border-color: #6a6a4a;">
    <h2>Battle</h2>
    <div class="field"><label>Your Men</label><input type="range" id="b-allies" min="0" max="30" value="12"><span class="val" id="b-allies-v">12</span></div>
    <div class="field"><label>Enemy Count</label><input type="range" id="b-enemies" min="1" max="30" value="15"><span class="val" id="b-enemies-v">15</span></div>
    <div class="field"><label>Orders</label>
      <select id="b-orders">
        <option value="charge">Charge — aggressive, fast, risky</option>
        <option value="hold" selected>Hold the line — balanced</option>
        <option value="shieldwall">Shield wall — defensive, slow</option>
      </select>
    </div>
    <div class="checks">
      <label><input type="checkbox" id="b-boss"> Boss (no surrender)</label>
    </div>
    <div class="checks">
      <label><input type="checkbox" id="b-archers"> Archers (pre-battle volley)</label>
    </div>
    <div class="field" id="archer-count-field" style="display:none"><label>Archers</label><input type="range" id="b-archer-count" min="2" max="10" value="4"><span class="val" id="b-archer-count-v">4</span></div>
    <div class="field"><label>Dread</label><input type="range" id="b-dread" min="0" max="5" value="0"><span class="val" id="b-dread-v">0</span></div>
    <div class="field"><label>Nobility</label><input type="range" id="b-nobility" min="0" max="5" value="0"><span class="val" id="b-nobility-v">0</span></div>
  </div>
</div>

<div class="controls">
  <button class="btn" id="btn-start" onclick="startCombat()">Start Combat</button>
  <button class="btn secondary" id="btn-reset" onclick="resetCombat()">Reset</button>
</div>

<div class="combat-area" id="combat-area" style="display:none">
  <div class="hp-bars">
    <div class="hp-bar"><div class="label">Chieftain</div>
      <div class="bar"><div class="fill player" id="hp-player" style="width:100%"></div><span class="text" id="hp-player-t"></span></div></div>
    <div class="hp-bar"><div class="label">Enemy</div>
      <div class="bar"><div class="fill enemy" id="hp-enemy" style="width:100%"></div><span class="text" id="hp-enemy-t"></span></div></div>
  </div>
  <div class="warband-status" id="warband-status"></div>
  <div class="stances" id="stances"></div>
  <div class="log" id="log"></div>
</div>

</div>
<script>
// ─── Slider value display ───────────────────────────────────────────────
document.querySelectorAll('input[type=range]').forEach(el => {
  const v = document.getElementById(el.id + '-v');
  if (v) { v.textContent = el.value; el.addEventListener('input', () => v.textContent = el.value); }
});

// ─── Enemy presets ──────────────────────────────────────────────────────
const ENEMY_PRESETS = {
  ashkin:  { weapon:'bone_club', armor:'none', shield:false, helm:false, hp:12, attack:3, diff:7, allies:12, enemies:15 },
  bandit:  { weapon:'rusty_sword', armor:'leather', shield:true, helm:false, hp:10, attack:2, diff:6, allies:10, enemies:8 },
  wolf:    { weapon:'teeth', armor:'none', shield:false, helm:false, hp:8, attack:3, diff:5, allies:8, enemies:12 },
  guard:   { weapon:'bronze_sword', armor:'bronze', shield:true, helm:true, hp:14, attack:4, diff:9, allies:15, enemies:20 },
};
// Show/hide sidearm when ranged weapon selected; enforce 2H → no shield
document.getElementById('p-weapon').onchange = function() {
  const ranged = ['bow', 'sling'].includes(this.value);
  document.getElementById('sidearm-field').style.display = ranged ? '' : 'none';
  const w = WEAPONS[this.value];
  const shieldEl = document.getElementById('p-shield');
  if (w && (w.twoHanded || w.ranged)) {
    shieldEl.checked = false;
    shieldEl.disabled = true;
  } else {
    shieldEl.disabled = false;
  }
};

document.getElementById('e-type').onchange = function() {
  const p = ENEMY_PRESETS[this.value]; if (!p) return;
  setVal('e-weapon', p.weapon); setVal('e-armor', p.armor);
  document.getElementById('e-shield').checked = p.shield;
  document.getElementById('e-helm').checked = p.helm;
  setRange('e-hp', p.hp); setRange('e-attack', p.attack); setRange('e-diff', p.diff);
  setRange('b-allies', p.allies); setRange('b-enemies', p.enemies);
};
function setVal(id,v){ document.getElementById(id).value = v; }
function setRange(id,v){ const el=document.getElementById(id); el.value=v; const vv=document.getElementById(id+'-v'); if(vv) vv.textContent=v; }
document.getElementById('b-archers').onchange = function() {
  document.getElementById('archer-count-field').style.display = this.checked ? '' : 'none';
};

// ─── Weapon definitions ─────────────────────────────────────────────────
const WEAPONS = {
  dagger:       { name:'Dagger',        crit:'puncture', fumble_max:2,  dmg:{glancing:[1,1], solid:[2,3], critical:[4,5], devastating:[6,7]}, self_dmg:[1,1] },
  hunting_knife:{ name:'Hunting Knife', crit:'slash',    fumble_max:2,  dmg:{glancing:[1,2], solid:[3,4], critical:[5,6], devastating:[7,8]}, self_dmg:[1,2] },
  shortsword:   { name:'Shortsword',    crit:'slash',    fumble_max:3,  dmg:{glancing:[2,2], solid:[3,4], critical:[5,6], devastating:[7,8]}, self_dmg:[1,2] },
  longsword:    { name:'Longsword',     crit:'slash',    fumble_max:4,  dmg:{glancing:[2,3], solid:[4,5], critical:[6,7], devastating:[8,9]}, self_dmg:[2,3] },
  spear:        { name:'Spear',         crit:'puncture', fumble_max:5,  dmg:{glancing:[1,2], solid:[3,4], critical:[5,6], devastating:[7,8]}, self_dmg:[2,3] },
  javelin:      { name:'Javelin',       crit:'puncture', fumble_max:6,  dmg:{glancing:[1,2], solid:[3,4], critical:[5,7], devastating:[7,8]}, self_dmg:[2,3] },
  hand_axe:     { name:'Hand Axe',      crit:'slash',    fumble_max:5,  dmg:{glancing:[1,2], solid:[3,4], critical:[5,6], devastating:[7,8]}, self_dmg:[1,2] },
  battle_axe:   { name:'Battle Axe',   crit:'slash',    fumble_max:9,  dmg:{glancing:[2,3], solid:[4,6], critical:[7,8], devastating:[9,10]}, self_dmg:[2,4], twoHanded:true },
  hammer:       { name:'Hammer',        crit:'crush',    fumble_max:7,  dmg:{glancing:[1,2], solid:[3,5], critical:[6,7], devastating:[8,9]}, self_dmg:[2,3], twoHanded:true },
  club:         { name:'Club',          crit:'crush',    fumble_max:8,  dmg:{glancing:[1,2], solid:[3,5], critical:[6,7], devastating:[8,9]}, self_dmg:[2,3] },
  bow:          { name:'Bow',           crit:'ranged',   fumble_max:5,  dmg:{glancing:[2,2], solid:[3,4], critical:[6,7], devastating:[8,9]}, self_dmg:[1,2], ranged:true },
  sling:        { name:'Sling',         crit:'ranged',   fumble_max:4,  dmg:{glancing:[1,2], solid:[3,4], critical:[5,6], devastating:[7,8]}, self_dmg:[1,2], ranged:true },
};

const ENEMY_WEAPONS = {
  bone_club:    { name:'Bone Club',     crit:'crush' },
  stone_axe:    { name:'Stone Axe',     crit:'slash' },
  rusty_sword:  { name:'Rusty Sword',   crit:'slash' },
  bronze_sword: { name:'Bronze Sword',  crit:'slash' },
  broadsword:   { name:'Broadsword',    crit:'slash' },
  spear:        { name:'Spear',         crit:'puncture' },
  hammer:       { name:'Hammer',        crit:'crush' },
  teeth:        { name:'Teeth & Claws', crit:'puncture' },
  fists:        { name:'Fists',        crit:'crush' },
};

// ─── CONDITIONAL DAMAGE TEXTS ───────────────────────────────────────────
// Each entry: { text(ctx) → string, dmg(ctx) → number }
// ctx = { armor, helm, shield, weapon_crit, enemy_armor, enemy_helm, enemy_shield }
// Player attacks enemy → ctx.armor/helm/shield = ENEMY's gear
// Enemy attacks player → ctx.armor/helm/shield = PLAYER's gear

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function rng(a,b) { return a + Math.floor(Math.random() * (b - a + 1)); }
function bladeOrShaft(name) { return ['Spear', 'Javelin'].includes(name) ? 'shaft' : 'blade'; }

const ARMOR_SOAK = { none: 0, leather: 1, bronze: 2 };

// ─── PLAYER ATTACK TEXTS (by weapon crit type) ─────────────────────────

const PLAYER_ATTACKS = {
  // ── PUNCTURE (spear, javelin, dagger) ───────────────────────────────
  puncture: {
    fumble: [
      ctx => ({ text: `${ctx.weaponName} slips in sweating hands. You stumble forward, exposed.`, dmg: 0, self: rng(2,3) }),
      ctx => ({ text: `Overcommit on the thrust. He sidesteps. ${ctx.weaponName} buries in dirt.`, dmg: 0, self: rng(2,3) }),
      ctx => ctx.shield
        ? { text: `He catches the ${ctx.weaponName.toLowerCase()} on his shield rim and wrenches it sideways. Your wrist screams.`, dmg: 0, self: 3 }
        : { text: `He grabs your ${ctx.weaponName.toLowerCase()} mid-thrust. Pulls. You go with it, face-first.`, dmg: 0, self: 2 },
      ctx => ({ text: `Wet ground. Foot slides. The thrust goes wide and your balance goes with it.`, dmg: 0, self: rng(1,2) }),
      ctx => ({ text: `${ctx.weaponName} tangles with the man beside you. You pull it free too late. He's already swinging.`, dmg: 0, self: rng(1,3) }),
    ],
    miss: [
      ctx => ({ text: `He twists aside. ${ctx.weaponName} takes air.`, dmg: 0, self: 1 }),
      ctx => ({ text: "Too slow. He reads the thrust.", dmg: 0, self: 0 }),
      ctx => ctx.shield
        ? { text: `${ctx.weaponName} thuds into his shield. Point doesn't get through.`, dmg: 0, self: 1 }
        : { text: "Wide by a hand's width. He doesn't flinch.", dmg: 0, self: 0 },
      ctx => ({ text: `Thrust. Parried. ${ctx.weaponName} slides off his guard.`, dmg: 0, self: 0 }),
      ctx => ({ text: `He rocks back just enough. Point passes a finger from his belly.`, dmg: 0, self: 0 }),
      ctx => ({ text: `He shifts his weight. The point grazes cloth. Nothing more.`, dmg: 0, self: 0 }),
    ],
    glancing: [
      ctx => ctx.armor === 'bronze'
        ? { text: `Scrapes across bronze. Sparks. No blood.`, dmg: 1, self: 0 }
        : ctx.armor === 'leather'
        ? { text: `Pierces leather at the ribs. Shallow. He hisses.`, dmg: 2, self: 0 }
        : { text: `Forearm. Thin red line.`, dmg: 2, self: 0 },
      ctx => ctx.armor !== 'none'
        ? { text: `Jabs the thigh. Armor blunts it. He limps, barely.`, dmg: 1, self: 0 }
        : { text: `Outer thigh. Shallow. Blood runs down his leg.`, dmg: 2, self: 0 },
      ctx => ({ text: `Ear. Tip cuts the lobe clean. Blood down the jaw.`, dmg: 2, self: 0 }),
      ctx => ({ text: `Hip. Glancing. Cloth tears, skin opens. He shifts.`, dmg: 2, self: 0 }),
      ctx => ({ text: `Knuckles. Skin splits. He flexes the hand. Still works.`, dmg: 1, self: 0 }),
      ctx => ({ text: `Upper arm. Skin parts. He looks at it — annoyed, not worried.`, dmg: 2, self: 0 }),
      ctx => ({ text: `Calf. Tip drags across muscle. He shifts weight to the other leg.`, dmg: 2, self: 0 }),
      ctx => ({ text: `Ribs. Tip scrapes bone. He flinches. Blood beads along the scratch.`, dmg: 2, self: 0 }),
    ],
    solid: [
      ctx => ctx.armor === 'bronze'
        ? { text: `Finds the gap at the armpit. Through the scales. He gasps.`, dmg: 3, self: 0, fx: 'bleed_1' }
        : ctx.armor === 'leather'
        ? { text: `Through leather into the ribs. He doubles over. Blood darkens the hide.`, dmg: 4, self: 0, fx: 'bleed_1' }
        : { text: `Below the ribs. Clean entry. He staggers, staring at the ${bladeOrShaft(ctx.weaponName)}.`, dmg: 5, self: 0, fx: 'bleed_1' },
      ctx => ctx.shield
        ? { text: `Past the shield edge, into the shoulder. He drops the shield arm.`, dmg: 4, self: 0, fx: 'cripple' }
        : { text: `Shoulder. Deep. Arm drops. Weapon clatters from nerveless fingers.`, dmg: 5, self: 0, fx: 'cripple' },
      ctx => ({ text: `Into the side. Muscle and fat. He pulls back. Hand pressed to the wound.`, dmg: 4, self: 0, fx: 'bleed_1' }),
      ctx => ({ text: `Lower back. He arches. Reaches behind. Can't find the wound with his fingers.`, dmg: 4, self: 0, fx: 'bleed_1' }),

      weapon: document.getElementById('e-weapon').value,

function startCombat() {
  const s = getSetup();
  const maxEnd = s.player.grit * 3 + 5;
  combat = {
    ...s,
    round: 0,
    playerHP: maxEnd,
    playerMaxHP: maxEnd,
    enemyHP: s.enemy.hp,
    enemyMaxHP: s.enemy.hp,
    groupStatus: 'strong',
    ended: false,
    shieldBroken: false,
    // ── Effect tracking ──
    enemyStunned: false,
    enemyCrippled: false,
    enemyBleed: 0,
    playerStunned: false,
    playerCrippled: false,
    playerBleed: 0,
    // ── Warband state ──
    allyWarriors: spawnWarriors(s.battle.allies, 'ally', s.battle.orders, s.player.heart),
    enemyWarriors: spawnWarriors(s.battle.enemies, 'enemy', 'hold', 0),
    alliesAlive: s.battle.allies,
    alliesStart: s.battle.allies,
    enemiesAlive: s.battle.enemies,
    enemiesStart: s.battle.enemies,
    orders: s.battle.orders,
    boss: s.battle.boss,
    dread: s.battle.dread,
    nobility: s.battle.nobility,
    surrenderPending: false,
    enemyDisarmed: false,
    killCount: 0,
    legendThresholds: [1, 3, 6, 10, 15, 21],  // kills needed for each legend point
    consecutiveKills: 0,
    enemyAttackNerfed: false,
    enemyHitCount: 0,
    // ── Archer state ──
    archers: s.battle.archers,
    archerCount: s.battle.archerCount || 0,
    archerBonus: false,
    rangedPhase: WEAPONS[s.player.weapon]?.ranged || false,
    rangedBreakthrough: false,
    sidearm: document.getElementById('p-sidearm')?.value || 'shortsword',
  };

  document.getElementById('combat-area').style.display = '';
  document.getElementById('log').innerHTML = '';
  updateBars();
  updateWarbandStatus();

  // ── Pre-battle archer volley ──
  if (combat.archers && combat.archerCount > 0) {
    let volleyLog = '<div class="log-entry round-start"><div class="round-num">Pre-Battle — Archer Volley</div>';
    let enemiesHit = 0;
    for (let i = 0; i < combat.archerCount; i++) {
      if (Math.random() < 0.3) enemiesHit++;
    }
    enemiesHit = Math.min(enemiesHit, combat.enemiesAlive - 1);
    combat.enemiesAlive -= enemiesHit;

    if (enemiesHit > 0) {
      const texts = [
        `Arrows fall like rain. ${enemiesHit} drop before they reach the line.`,
        `The volley strikes home. ${enemiesHit} go down in the first breath.`,
        `Bowstrings sing. ${enemiesHit} of them crumple before the real fighting starts.`,
      ];
      volleyLog += `<span class="atk">${pick(texts)}</span>`;
      volleyLog += `<div class="dmg-line"><span class="dmg-player">[${enemiesHit} enemies down]</span></div>`;
    } else {
      volleyLog += `<span class="atk">Arrows fly. Wide, short, lost in the chaos. No one falls.</span>`;
    }

    if (combat.enemiesAlive > combat.alliesAlive) {
      volleyLog += `<div class="warband-line">Enemies close fast. Archers drop bows and draw blades. ${combat.archerCount} join the melee.</div>`;
      combat.alliesAlive += combat.archerCount;
      combat.alliesStart += combat.archerCount;
    } else {
      volleyLog += `<div class="warband-line">Archers hold position behind the line. They keep shooting.</div>`;
      combat.archerBonus = true;
    }

    volleyLog += '</div>';
    document.getElementById('log').innerHTML += volleyLog;
    updateWarbandStatus();
  }

  showStances();
  document.getElementById('btn-start').disabled = true;
}

function resetCombat() {
  combat = null;
  document.getElementById('combat-area').style.display = 'none';
  document.getElementById('btn-start').disabled = false;
}

function updateBars() {
  const pp = Math.max(0, combat.playerHP / combat.playerMaxHP * 100);
  const ep = Math.max(0, combat.enemyHP / combat.enemyMaxHP * 100);
  document.getElementById('hp-player').style.width = pp + '%';
  document.getElementById('hp-enemy').style.width = ep + '%';
  document.getElementById('hp-player-t').textContent = Math.max(0,combat.playerHP) + '/' + combat.playerMaxHP;
  document.getElementById('hp-enemy-t').textContent = Math.max(0,combat.enemyHP) + '/' + combat.enemyMaxHP;
}

function updateWarbandStatus() {
  const c = combat;
  let html = '';
  if (c.alliesStart > 0 || c.enemiesStart > 1) {
    html += '<span class="forces" style="color:#8ab88a">⚔ ' + c.alliesAlive + '</span>';
    html += '<span style="color:#666"> / ' + c.alliesStart + ' </span>';
    html += '<span style="color:#888">vs</span> ';
    html += '<span class="forces" style="color:#c85050">' + c.enemiesAlive + '</span>';
    html += '<span style="color:#666"> / ' + c.enemiesStart + '</span>';
    html += ' · <span>' + c.groupStatus + '</span>';
    html += ' · <span>' + c.orders + '</span>';
  } else {
    html += 'Duel · <span>' + c.groupStatus + '</span>';
  }
  if (c.dread > 0) html += ' · Dread: <span style="color:#e86060">' + c.dread + '</span>';
  if (c.nobility > 0) html += ' · Nobility: <span style="color:#8ab88a">' + c.nobility + '</span>';
  if (c.player.legend > 0) html += ' · Legend: <span style="color:#c8a96e">' + c.player.legend + '</span>';
  document.getElementById('warband-status').innerHTML = html;
}

function showStances() {
  if (combat.ended) { document.getElementById('stances').innerHTML = ''; return; }

  // Stun recovery: only one option
  if (combat.playerStunned) {
    const html = `<button class="stance-btn" onclick="resolveRound('recover','grit',0)">
      Recover — find your footing<span class="stat">grit ${combat.player.grit} · no attack</span></button>`;
    document.getElementById('stances').innerHTML = html;
    return;
  }

  // Ranged breakthrough — enemy got through the line
  if (combat.rangedPhase && combat.rangedBreakthrough) {
    const html = `
      <div style="color:#c85050; font-style:italic; margin-bottom:8px;">One breaks through! He's running straight at you.</div>
      <button class="stance-btn" onclick="resolveRangedTransition('drop')" style="border-color:#8ab88a">
        Drop the bow. Draw blade.<span class="stat">Switch to melee. No free hit.</span></button>
      <button class="stance-btn" onclick="resolveRangedTransition('shoot')" style="border-color:#c8a96e">
        Loose.<span class="stat">wits ${combat.player.wits} · hit = second shot. miss = he gets a free hit.</span></button>`;
    document.getElementById('stances').innerHTML = html;
    return;
  }

  const w = WEAPONS[combat.player.weapon];
  const stances = [
    { id:'forward', label:'Forward — lead the charge', stat:'strength', bonus:1 },
    { id:'open', label:'Open — fight in the line', stat:'strength', bonus:0 },
  ];

  if (combat.player.shield) {
    stances.push({ id:'defensive', label:'Defensive — shield wall', stat:'grit', bonus:2 });
  } else {
    stances.push({ id:'defensive', label:'Defensive — brace and recover', stat:'grit', bonus:0 });
  }

  if (['bow', 'spear', 'javelin', 'sling'].includes(combat.player.weapon)) {
    stances.push({ id:'rearward', label:'Rearward — strike from behind the line', stat:'wits', bonus:2 });
  }

  const html = stances.map(s => {
    const statVal = combat.player[s.stat];
    return `<button class="stance-btn" onclick="resolveRound('${s.id}','${s.stat}',${s.bonus})">
      ${s.label}<span class="stat">${s.stat} ${statVal} · bonus +${s.bonus}</span></button>`;
  }).join('');

  document.getElementById('stances').innerHTML = html;
}
